<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="t" font-family="Archivo, Arial, sans-serif">
  <title id="t">Remittance reconciliation pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f6b4f"/>
    </marker>
  </defs>
  <rect width="760" height="270" fill="#f1f7f3"/>
  <g stroke="#2f6b4f" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="156" y1="44" x2="224" y2="130"/>
    <line x1="156" y1="104" x2="224" y2="134"/>
    <line x1="156" y1="164" x2="224" y2="140"/>
    <line x1="156" y1="224" x2="224" y2="146"/>
    <line x1="366" y1="135" x2="434" y2="44"/>
    <line x1="366" y1="135" x2="434" y2="134"/>
    <line x1="366" y1="135" x2="434" y2="224"/>
    <line x1="596" y1="44" x2="624" y2="120"/>
    <line x1="596" y1="134" x2="624" y2="135"/>
    <line x1="596" y1="224" x2="624" y2="150"/>
  </g>
  <g font-size="13" fill="#17251d" text-anchor="middle">
    <g stroke="#2f6b4f" fill="#ffffff">
      <rect x="16" y="24" width="140" height="40" rx="6"/>
      <rect x="16" y="84" width="140" height="40" rx="6"/>
      <rect x="16" y="144" width="140" height="40" rx="6"/>
      <rect x="16" y="204" width="140" height="40" rx="6"/>
    </g>
    <text x="86" y="49">Lockbox scans</text>
    <text x="86" y="109">ACH files</text>
    <text x="86" y="169">Email advice</text>
    <text x="86" y="229">Vendor portals</text>

    <rect x="226" y="75" width="140" height="120" rx="8" fill="#2f6b4f"/>
    <g fill="#ffffff">
      <text x="296" y="122" font-weight="600">Read and extract</text>
      <text x="296" y="142">A confidence score</text>
      <text x="296" y="160">on every field</text>
    </g>

    <g stroke="#2f6b4f" fill="#ffffff">
      <rect x="436" y="24" width="160" height="40" rx="6"/>
      <rect x="436" y="114" width="160" height="40" rx="6"/>
      <rect x="436" y="204" width="160" height="40" rx="6"/>
    </g>
    <g font-size="12">
      <text x="516" y="41" font-weight="600">High confidence</text>
      <text x="516" y="57">assigned automatically</text>
      <text x="516" y="131" font-weight="600">Middle band</text>
      <text x="516" y="147">a person chooses</text>
      <text x="516" y="221" font-weight="600">Low confidence</text>
      <text x="516" y="237">manual review</text>
    </g>

    <rect x="626" y="75" width="124" height="120" rx="8" fill="#ffffff" stroke="#2f6b4f"/>
    <g font-size="12">
      <text x="688" y="122" font-weight="600">Post the match</text>
      <text x="688" y="142">Every check and</text>
