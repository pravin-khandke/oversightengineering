<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="t" font-family="Archivo, Arial, sans-serif">
  <title id="t">Retiring a platform service by service</title>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f6b4f"/>
    </marker>
  </defs>
  <rect width="760" height="270" fill="#f1f7f3"/>
  <g font-size="13" fill="#17251d" text-anchor="middle" font-weight="600">
    <text x="140" y="28">Start</text>
    <text x="380" y="28">Midway</text>
    <text x="620" y="28">End</text>
  </g>
  <rect x="40" y="40" width="200" height="120" fill="#c3d1c8"/>
  <rect x="280" y="40" width="200" height="70" fill="#c3d1c8"/>
  <rect x="280" y="110" width="200" height="50" fill="#2f6b4f"/>
  <rect x="520" y="40" width="200" height="120" fill="#2f6b4f"/>
